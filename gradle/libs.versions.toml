[versions]
min-sdk = "30"
target-sdk = "37"
compile-sdk = "37"
agp = "9.3.1"
kotlin = "2.4.10"
cacheFix = "3.0.3"
coroutines = "1.11.0"
circuit = "0.36.0"
compose-guard = "2.6.0"
dependencyAnalysis = "3.18.0"
work = "2.11.2"
licensee = "1.14.1"
kover = "0.9.9"
glance = "1.1.1"
sort = "0.20.0"
guard = "0.5.0"
sqldelight = "2.3.2"
ktor = "3.5.2"
jdk = "26"
jdkTarget = "17"
convention-plugin = "0.4.0"

[plugins]
